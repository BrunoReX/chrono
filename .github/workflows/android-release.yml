name: Android Release

on:
  push:
    tags:
    - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: "17"
          # cache: 'gradle'

      - name: Install Android SDK & Command Line Tools
        run: |
          sudo apt-get update && sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip && rm cmdline-tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android Licenses
        run: |
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: 'stable'
          cache: false

      - name: Create key.properties
        run: |
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" > ./android/key.properties
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> ./android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> ./android/key.properties

      - name: Load key
        run: echo "${{ secrets.KEYSTORE_JKS_RELEASE }}" | base64 --decode --ignore-garbage > android/app/release-key.jks

      - name: Turn off analytics
        run: flutter config --no-analytics

      - name: Clear cache
        run: |
          flutter clean
          rm -rf ~/.gradle/caches

      - name: Pub Get Packages
        run: flutter pub get

      - name: Build APPBUNDLE
        run: flutter build appbundle --flavor prod

      - name: Build APK
        run: flutter build apk --release --split-per-abi --flavor prod

      - name: Save Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-outputs
          path: |
            build/app/outputs/flutter-apk/*.apk

      - name: set env
        run: echo "::set-env name=NOW::$(date +'%Y%m%d%H%M%S')"

      - name: Create Github Release
        if: !env.ACT
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          body: "nothing"
          draft: true
          tag: ${{ env.NOW }}
